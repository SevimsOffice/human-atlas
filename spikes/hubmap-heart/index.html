<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spike: HuBMAP heart in Three.js</title>
<style>
  html,body{margin:0;height:100%;background:#1d1f22;color:#e8e8e6;font:13px/1.4 system-ui,sans-serif}
  #info{position:absolute;top:12px;left:12px;max-width:340px;background:rgba(29,31,34,.85);border:1px solid #3a3d42;padding:10px 12px}
  #info pre{font:11px ui-monospace,monospace;white-space:pre-wrap;margin:6px 0 0}
  #credit{position:absolute;bottom:8px;left:12px;font-size:11px;color:#9a9c9f}
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info"><b>Spike — VH_M_Heart.glb</b> <span id="hover">(click a structure)</span><pre id="out">loading…</pre></div>
<div id="credit">3D Reference Organ for Heart, Male — HuBMAP HRA, Browne &amp; Schlehlein 2022, doi:10.48539/HBM373.VSTV.568, CC BY 4.0</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1f22);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.001, 100);
scene.add(new THREE.HemisphereLight(0xf2f4f7, 0x2a2c30, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(1, 2, 3); scene.add(key);
const controls = new OrbitControls(camera, renderer.domElement);

const t0 = performance.now();
new GLTFLoader().load('/model/VH_M_Heart.glb', (gltf) => {
  const root = gltf.scene;
  const meshes = [];
  root.traverse((o) => { if (o.isMesh) {
    o.material = new THREE.MeshStandardMaterial({ color: 0x9e2a2b, roughness: 0.55, transparent: true, opacity: 0.85 });
    meshes.push(o);
  }});
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0, 0, size.length() * 1.6));
  controls.update();
  const nodes = []; root.traverse((o) => { if (o.name && o !== root) nodes.push(o.name + (o.isMesh ? '' : ' [group]')); });
  let tris = 0; meshes.forEach((m) => { tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
  const result = { loadMs: Math.round(performance.now() - t0), meshCount: meshes.length, triangles: tris,
    bboxSize: size.toArray().map((v) => +v.toFixed(4)), nodes };
  document.getElementById('out').textContent = JSON.stringify(result, null, 1);
  window.__spike = result;

  // click-to-select proves picking works on these meshes
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let sel = null;
  renderer.domElement.addEventListener('click', (e) => {
    ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(meshes, false)[0];
    if (sel) sel.material.emissive.setHex(0);
    sel = hit ? hit.object : null;
    if (sel) sel.material.emissive.setHex(0x553311);
    document.getElementById('hover').textContent = sel ? sel.name : '(nothing)';
    window.__picked = sel ? sel.name : null;
  });
}, undefined, (err) => { document.getElementById('out').textContent = 'ERROR ' + err; window.__spike = { error: String(err) }; });

(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
